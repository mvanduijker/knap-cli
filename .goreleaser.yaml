version: 2

project_name: knap

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/knap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    binary: knap

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Needs a mvanduijker/homebrew-tap repo and a HOMEBREW_TAP_TOKEN secret.
# Until both exist, keep skip_upload on so tagging still cuts a release.
homebrew_casks:
  - name: knap
    binaries:
      - knap
    repository:
      owner: mvanduijker
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://knap.app
    description: Manage your knap.app allowance accounts from the terminal
    license: MIT
    skip_upload: true
